[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test execution and coverage
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=10
    --cov=.
    --cov-report=term-missing
    --cov-report=html:tests/reports/coverage_html
    --cov-report=json:tests/reports/coverage.json
    --cov-fail-under=80

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    performance: marks tests as performance tests
    quality: marks tests as quality tests
    cli: marks tests as CLI tests
    agents: marks tests as agent tests
    workflow: marks tests as workflow tests
    memory: marks tests as memory tests
    tools: marks tests as tools tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Minimum version
minversion = 7.0

# Test timeout (if pytest-timeout is installed)
timeout = 300 